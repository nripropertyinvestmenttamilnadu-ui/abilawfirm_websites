<style>
:root{--black:#0d0d0d;--gold:#F5D547;--ink:#1a1a1a;--muted:#5f5f5f;--line:#e7e7e7;--soft:#f6f4ef}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--soft);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px;width:100%}
header{background:#000;border-bottom:4px solid var(--gold)}
header .wrap{display:flex;align-items:center;height:80px}
header img{height:50px}
main{flex:1;display:grid;place-items:center;padding:70px 0}
.box{background:#fff;border:1px solid var(--line);border-top:5px solid var(--gold);border-radius:8px;max-width:620px;margin:0 auto;padding:56px 48px;text-align:center;box-shadow:0 24px 50px rgba(0,0,0,.06)}
.tick{width:84px;height:84px;border-radius:50%;background:var(--black);display:grid;place-items:center;margin:0 auto 26px}
.tick svg{width:40px;height:40px;color:var(--gold)}
h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin-bottom:14px}
.box p{color:var(--muted);font-size:17px;margin-bottom:10px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 24px;border-radius:6px;font-weight:600;font-size:15px;border:1px solid transparent}
.btn-gold{background:var(--gold);color:#111}
.btn-dark{background:#25D366;color:#fff}
.btn-line{border-color:var(--line)}
footer{background:#000;color:#a3a3a3;font-size:13px;border-top:4px solid var(--gold);padding:22px 0;text-align:center}
@media (max-width:640px){.box{padding:40px 22px}.btn{width:100%;justify-content:center}.wrap{padding:0 16px}}
</style>
</head>

<header><div class="wrap"><a href="/"><img src="https://landing.abilawfirm.in/images/logo.avif" alt="ABI LAW FIRM"></a></div></header>
<main>
  <div class="wrap">

      <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>

        <a href="/" class="btn btn-line">Back to Home</a>
      </div>
    </div>
  </div>
</main>
<footer>© 2026 ABI LAW FIRM. All rights reserved.</footer>
